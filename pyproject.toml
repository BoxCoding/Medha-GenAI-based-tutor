# Tool configuration only — deliberately NO [project] table.
# Serverless Python builders treat a [project] table as "install this repo as a
# package"; Medhā is an application deployed from source, and its dependencies
# live in requirements.txt (runtime) / requirements-dev.txt (tests + lint).

[tool.ruff]
line-length = 100
# Conservative target: the deployed serverless runtime may be older than the
# local interpreter, so lint must not push 3.11+ only syntax into the code.
target-version = "py310"
src = ["backend", "tests"]
extend-exclude = [".venv"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import ordering)
    "B",   # bugbear
    "UP",  # pyupgrade
    "SIM", # simplify
    "N",   # naming conventions
]
ignore = [
    "B008", # function call in default arg — FastAPI's Depends()/Cookie() idiom
]

[tool.ruff.lint.per-file-ignores]
# Tests configure the environment before importing the app under test.
"tests/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # Upstream starlette/httpx transition notice (raised at fastapi import
    # time, warning class lives in starlette) — not actionable here.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated.*",
]
